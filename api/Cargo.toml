[package]
name = "photometoria-rest-api"
version = "0.3.0"
edition = "2024"

[lib]
name = "photometoria_rest_api"
path = "src/lib.rs"

[[bin]]
name = "photometoria"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1"
base64 = "0.22"
infer = "0.16"
axum = { version = "0.8.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
reqwest = { version = "0.13.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
wiremock = "0.6"
